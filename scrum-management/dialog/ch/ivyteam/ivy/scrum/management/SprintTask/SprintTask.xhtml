<html
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:f="jakarta.faces.core"
  xmlns:h="jakarta.faces.html"
  xmlns:ui="jakarta.faces.facelets"
  xmlns:ic="http://ivyteam.ch/jsf/component"
  xmlns:p="primefaces"
  xmlns:pe="primefaces.extensions"
>
  <h:body>
    <ui:composition template="/layouts/frame-10.xhtml">
      <ui:define name="title">SprintTask</ui:define>
      <ui:define name="content">
        <h:form>
          <style type="text/css">
            .sprint-calender.sprint-calender
              td:not(.ui-state-disabled)
              a:not(.ui-state-active):not(.ui-state-active) {
              background-color: var(--success-color);
            }
            .sprint-calender.sprint-calender
              td:not(.ui-state-disabled)
              a.ui-state-active.ui-state-active {
              background-color: var(--error-color);
            }
            .sprint-calender
              :is(.ui-datepicker-prev, .ui-datepicker-next).ui-state-disabled {
              display: none;
            }
          </style>

          <p:card>
            <div
              style="
                display: flex;
                flex-direction: column;
                justify-content: space-between;
              "
            >
              <h:outputText
                value="#{data.sprint.versionCode}"
                style="font-size: 25px; font-weight: 550"
              />
              <div style="display: flex; gap: 45px; margin-top: 12px">
                <div>
                  <h:outputText
                    value="StartDate: "
                    style="color: var(--surface-600)"
                  />
                  <h:outputText value="#{data.sprint.startDate}" />
                </div>
                <div>
                  <h:outputText
                    value="EndDate: "
                    style="color: var(--surface-600)"
                  />
                  <h:outputText value="#{data.sprint.endDate}" />
                </div>
                <div>
                  <h:outputText
                    value="Sprint Number: "
                    style="color: var(--surface-600)"
                  />
                  <h:outputText value="Sprint #{data.sprint.sprintNumber}" />
                </div>
              </div>
            </div>
          </p:card>

          <p:card style="margin-top: 10px">
            <div
              style="
                display: flex;
                align-items: center;
                justify-content: left;
                gap: 6px;
                margin-bottom: 16px;
              "
            >
              <i class="pi pi-clock"></i>
              <span style="font-size: 18px; font-weight: 550"> Capacity</span>
            </div>

            <p:inputNumber
              value="#{data.member.capacity}"
              minValue="0"
              decimalPlaces="1"
              symbol=" %"
              symbolPosition="s"
              id="maxWorkingDays"
              maxValue="100"
            >
              <p:ajax
                event="change"
                process="@this"
                update="sprintPointsPreview , selectedAbsenceDays , workingDays"
              />
            </p:inputNumber>

            <span style="float: right; color: var(--surface-600)"
              >Percentage of your working capacity</span
            >
          </p:card>
          <p:card style="margin-top: 10px">
            <span
              style="
                font-size: 18px;
                display: block;
                font-weight: 550;
                margin-bottom: 10px;
              "
              >Select the days you are absent</span
            >
            <p:datePicker
              value="#{data.absenceDays}"
              selectionMode="multiple"
              inline="true"
              enabledDates="#{data.workingDates}"
              panelStyleClass="sprint-calender"
              style="width: 100%"
              mindate="#{data.sprint.startDate.toJavaDate()}"
              maxdate="#{data.sprint.endDate.toJavaDate()}"
            >
              <p:ajax
                event="dateSelect"
                process="@this"
                update="sprintPointsPreview , selectedAbsenceDays , workingDays"
              />
            </p:datePicker>
            <div
              style="
                display: flex;
                gap: 45px;
                margin-top: 12px;
                justify-content: space-between;
              "
            >
              <div>
                <h:outputText
                  value="Max working days"
                  style="color: var(--surface-600)"
                />
                <h:outputText
                  value="#{data.sprint.maxWorkingDays}"
                  style="display: block"
                />
              </div>

              <div>
                <h:outputText
                  value="Selected absence days"
                  style="color: var(--surface-600)"
                />
                <h:outputText
                  value="#{empty data.absenceDays ? 0 : data.absenceDays.size()}"
                  id="selectedAbsenceDays"
                  style="display: block"
                />
              </div>
              <div>
                <h:outputText
                  value="Working days "
                  style="color: var(--surface-600)"
                />
                <h:outputText
                  value="#{data.sprint.maxWorkingDays.intValue() - (empty data.absenceDays ? 0 : data.absenceDays.size())}"
                  id="workingDays"
                  style="display: block"
                />
              </div>
            </div>
            <div style="margin-top: 20px; color: var(--surface-400)">
              <h:outputText value="Review, Saturday and Sunday (Excluded)" />
            </div>
            <div style="margin-top: 5px; color: var(--surface-400)">
              <span
                ><i
                  class="pi pi-circle-fill"
                  style="color: var(--success-color); font-size: 10px"
                ></i>
                Avialable</span
              >
              <span
                ><i
                  class="pi pi-circle-fill"
                  style="
                    color: var(--error-color);
                    font-size: 10px;
                    margin-left: 10px;
                  "
                ></i>
                Absent</span
              >
              <span
                ><i
                  class="pi pi-circle-fill"
                  style="
                    color: rgb(112, 112, 112);
                    font-size: 10px;
                    margin-left: 10px;
                  "
                ></i>
                Unavailable</span
              >
            </div>
          </p:card>
          <p:card style="margin-top: 10px">
            <span
              style="
                font-size: 18px;
                display: block;
                margin-bottom: 10px;
                font-weight: 550;
              "
              >Points preview</span
            >
            <div>
              <h:outputText value="Estimated Sprint Points" />
              <h:outputText
                value="#{(data.sprint.maxWorkingDays.intValue() - (empty data.absenceDays ? 0 : data.absenceDays.size())) * data.sprint.sprintPointsPerDay.doubleValue() * (data.member.capacity / 100)}"
                style="
                  margin-top: 5px;
                  font-size: 24px;
                  font-weight: 500;
                  display: block;
                "
                id="sprintPointsPreview"
                ><f:convertNumber pattern="0.0"
              /></h:outputText>
            </div>
            <div>
              <p:commandButton
                style="
                  margin-top: 20px;
                  background-color: var(--primary-dark-color);
                  width: 100%;
                "
                value="Save"
                styleClass="ui-button-raised ui-button-primary"
                actionListener="#{logic.savetask()}"
              />
            </div>
          </p:card>
        </h:form>
      </ui:define>
    </ui:composition>
  </h:body>
</html>

<html
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:f="jakarta.faces.core"
  xmlns:h="jakarta.faces.html"
  xmlns:ui="jakarta.faces.facelets"
  xmlns:ic="http://ivyteam.ch/jsf/component"
  xmlns:p="primefaces"
  xmlns:pe="primefaces.extensions"
>
  <h:body>
    <ui:composition template="/layouts/frame-10.xhtml">
      <ui:define name="title">SprintOverview</ui:define>
      <ui:define name="content">
        <h1>#{data.sprint.versionCode}</h1>
        <h:form id="form">
          <p:dataTable
            value="#{data.sprint.members}"
            var="member"
            rowIndexVar="index"
            stickyHeader="true"
            editable="true"
            rowKey="#{index}"
            id="sprint-datatable"
          >
            <p:ajax event="rowEdit" oncomplete="refreshSprintTable()" />

            <p:column headerText="Name">
              <h:outputText value="#{member.name}" />
            </p:column>
            <p:column headerText="Work days">
              <p:cellEditor>
                <f:facet name="output">
                  <h:outputText value="#{member.workingDays}" />
                </f:facet>
                <f:facet name="input">
                  <p:inputText value="#{member.workingDays}" />
                </f:facet>
              </p:cellEditor>
            </p:column>
            <p:column headerText="Work">
              <p:cellEditor>
                <f:facet name="output">
                  <h:outputText value="#{member.capacity}" />
                </f:facet>
                <f:facet name="input">
                  <p:inputText value="#{member.capacity}" />
                </f:facet>
              </p:cellEditor>
            </p:column>

            <p:column headerText="Points">
              <h:outputText value="#{member.workingDays.doubleValue() * 0.4}">
                <f:convertNumber pattern="#0.0" />
              </h:outputText>
            </p:column>
            <p:column style="width: 6rem">
              <p:rowEditor />
            </p:column>

            <p:columnGroup type="footer">
              <p:row>
                <p:column colspan="3" />
                <p:column>
                  <f:facet name="footer">
                    <h:outputText
                      id="totalPoints"
                      value="#{logic.calculateTotalPoints()}"
                    >
                      <f:convertNumber pattern="#0.0" />
                    </h:outputText>
                  </f:facet>
                </p:column>
                <p:column />
              </p:row>
            </p:columnGroup>
          </p:dataTable>
          <p:remoteCommand
            name="refreshSprintTable"
            process="@this"
            update="sprint-datatable"
          />
        </h:form>

        <br />
        <div class="command-btns">
          <p:commandLink
            id="cancel"
            actionListener="#{ivyWorkflowView.cancel()}"
            process="@this"
            value="Cancel"
          />
          <p:commandButton
            id="proceed"
            actionListener="#{logic.close}"
            value="Proceed"
            update="form"
            icon="pi pi-check"
          />
        </div>
      </ui:define>
    </ui:composition>
  </h:body>
</html>

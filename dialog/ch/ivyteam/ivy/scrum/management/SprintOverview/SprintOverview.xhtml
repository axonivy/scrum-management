<html
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:f="jakarta.faces.core"
  xmlns:h="jakarta.faces.html"
  xmlns:ui="jakarta.faces.facelets"
  xmlns:ic="http://ivyteam.ch/jsf/component"
  xmlns:p="primefaces"
  xmlns:pe="primefaces.extensions"
>
  <h:body>
    <ui:composition template="/layouts/frame-10.xhtml">
      <ui:define name="title">TestDialog</ui:define>
      <ui:define name="content">
        <h1>#{data.sprint.versionCode}</h1>
        <p:dataTable value="#{data.sprint.members}" var="member">
          <p:column headerText="Name">
            <h:outputText value="#{member.name}" />
          </p:column>
          <p:column headerText="Work Days">
            <h:outputText value="#{member.workingDays}" />
          </p:column>
          <p:column headerText="Work">
            <h:outputText value="#{member.capacity}" />
          </p:column>
          <p:column headerText="Points">
            <!-- disable validator next-line: el-validator -->
            <h:outputText value="#{member.workingDays * 0.4}">
              <f:convertNumber pattern="#0.0" />
            </h:outputText>
          </p:column>
        </p:dataTable>
      </ui:define>
    </ui:composition>
  </h:body>
</html>

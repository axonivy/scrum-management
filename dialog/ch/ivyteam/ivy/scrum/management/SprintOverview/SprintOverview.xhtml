<html
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:f="jakarta.faces.core"
  xmlns:h="jakarta.faces.html"
  xmlns:ui="jakarta.faces.facelets"
  xmlns:ic="http://ivyteam.ch/jsf/component"
  xmlns:p="primefaces"
  xmlns:pe="primefaces.extensions"
>
  <h:body>
    <ui:composition template="/layouts/frame-10.xhtml">
      <ui:define name="title">Sprint Overview</ui:define>
      <ui:define name="content">
        <style type="text/css"></style>
        <h:form id="form">
          <p:panel
            header="#{data.sprint.versionCode}"
            style="text-align: center; font-size: 30px"
          >
            <p:commandButton
              style="
                background-color: #fafafa00;
                border: 1px solid #a3cbd900;
                background-image: none;
                border-radius: 4px;
                color: rgb(0, 0, 0);
              "
              id="back"
              icon="fa-regular fa-circle-left"
              iconPos="middle"
              actionListener="#{logic.sprintlast}"
              update="@form"
            />
            <h:outputText value="#{data.sprint.startDate}">
              <f:convertDateTime pattern="dd/MM/yyyy" />
            </h:outputText>

            <h:outputText value=" - " style="font-size: 50%" />

            <h:outputText value="#{data.sprint.endDate}" style="font-size: 50%">
              <f:convertDateTime pattern="dd/MM/yyyy" />
            </h:outputText>
            <h:outputText
              value=" / Sprint Number: #{data.sprint.sprintNumber}"
            />
            <p:commandButton
              iconPos="middle"
              style="
                background-color: #fafafa00;
                border: 1px solid #a3cbd900;
                background-image: none;
                border-radius: 4px;
                color: rgb(0, 0, 0);
              "
              id="forward"
              icon="fa-regular fa-circle-right"
              actionListener="#{logic.sprintnext}"
              update="@form"
            />
          </p:panel>

          <br />

          <p:dataTable
            value="#{data.sprint.members}"
            var="member"
            rowIndexVar="index"
            stickyHeader="false"
            editable="true"
            rowKey="#{index}"
            id="sprint-datatable"
            scrollable="true"
            allowUnsorting="true"
            liveResize="true"
            resizableColumns="true"
            cellNavigation="true"
            rowHover="true"
          >
            <p:ajax event="rowEdit" oncomplete="refreshSprintTable()" />

            <p:column headerText="Name" title="Name of user">
              <div
                style="
                  display: flex;
                  flex-direction: row;
                  align-items: center;
                  gap: 8px;
                "
              >
                <p:avatar
                  icon="pi pi-user"
                  shape="circle"
                  style="
                    width: 24px;
                    height: 24px;
                    font-size: 11px;
                    flex-shrink: 0;
                  "
                />
                <h:outputText value="#{member.name}" />
              </div>
            </p:column>
            <p:column
              headerText="Days"
              title="Days the user is working"
              sortBy="#{member.workingDays.doubleValue()}"
            >
              <p:cellEditor>
                <f:facet name="output">
                  <h:outputText value="#{member.workingDays}" />
                </f:facet>
                <f:facet name="input">
                  <p:inputNumber
                    value="#{member.workingDays}"
                    minValue="0"
                    maxValue="#{data.sprint.maxWorkingDays}"
                    decimalPlaces="1"
                  />
                </f:facet>
              </p:cellEditor>
            </p:column>
            <p:column
              headerText="Capacity"
              title="Percentage user is working on sprint"
              sortBy="#{member.capacity.doubleValue()}"
            >
              <p:cellEditor>
                <f:facet name="output">
                  <h:outputText value="#{member.capacity}%" />
                </f:facet>
                <f:facet name="input">
                  <p:inputNumber
                    value="#{member.capacity}"
                    minValue="0"
                    maxValue="100"
                    decimalPlacesRawValue="0"
                    validatorMessage="0-100"
                  />
                </f:facet>
              </p:cellEditor>
            </p:column>

            <p:column
              headerText="Points (#{data.sprint.sprintPointsPerDay})"
              title="Points/Day#{data.sprint.sprintPointsPerDay}"
              sortBy="#{member.capacity.doubleValue() / 100 * member.workingDays.doubleValue() * data.sprint.sprintPointsPerDay.doubleValue()}"
            >
              <h:outputText
                value="#{member.capacity.doubleValue() / 100 * member.workingDays.doubleValue() * data.sprint.sprintPointsPerDay.doubleValue()}"
              >
                <f:convertNumber pattern="#0.0" />
              </h:outputText>
            </p:column>
            <p:column style="width: 6rem" headerText="Edit">
              <p:rowEditor />
            </p:column>
          </p:dataTable>
          <p:remoteCommand
            name="refreshSprintTable"
            process="@this"
            update="sprint-datatable"
          />

          <br />
          <div
            style="
              display: flex;
              justify-content: space-between;
              align-items: center;

              background: var(--surface-a);
              border-top: 1px solid var(--surface-border);

              padding: 12px 20px;
              margin-top: 12px;

              position: sticky;
              bottom: 0;
              z-index: 10;
            "
          >
            <p:commandButton
              id="proceed"
              actionListener="#{logic.close}"
              value="Close"
              icon="fa-regular fa-square-minus"
              iconPos="right"
              update="form"
              style="
                background-color: #fafafa;
                border: 1px solid #a3cbd9;
                background-image: none;
                border-radius: 4px;
                color: black;
              "
            />
            <p:commandButton
              id="editopensprint"
              actionListener="#{logic.edit}"
              value="Edit"
              update="form"
              icon="fa-regular fa-pen-to-square"
              iconPos="right"
              style="
                background-color: #fafafa;
                border: 1px solid #a3cbd9;
                background-image: none;
                border-radius: 4px;
                color: black;
              "
            />
          </div>
        </h:form>
      </ui:define>
    </ui:composition>
  </h:body>
</html>

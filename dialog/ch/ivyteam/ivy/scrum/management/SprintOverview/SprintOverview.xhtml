<html
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:f="jakarta.faces.core"
  xmlns:h="jakarta.faces.html"
  xmlns:ui="jakarta.faces.facelets"
  xmlns:ic="http://ivyteam.ch/jsf/component"
  xmlns:p="primefaces"
  xmlns:pe="primefaces.extensions"
>
  <h:body>
    <ui:composition template="/layouts/frame-10.xhtml">
      <ui:define name="title">Sprint Overview</ui:define>
      <ui:define name="content">
        <p:panel header="#{data.sprint.versionCode}" style="text-align: center">
          <h:outputText value="#{data.sprint.startDate}">
            <f:convertDateTime pattern="dd/MM/yyyy" />
          </h:outputText>

          <h:outputText value=" - " />

          <h:outputText value="#{data.sprint.endDate}">
            <f:convertDateTime pattern="dd/MM/yyyy" />
          </h:outputText>
          <h:outputText value=" / Sprint Number: #{data.sprint.sprintNumber}" />
        </p:panel>

        <br />

        <h:form id="form">
          <p:dataTable
            value="#{data.sprint.members}"
            var="member"
            rowIndexVar="index"
            stickyHeader="true"
            editable="true"
            rowKey="#{index}"
            id="sprint-datatable"
            scrollable="true"
            scrollHeight="550"
          >
            <p:ajax event="rowEdit" oncomplete="refreshSprintTable()" />

            <p:column headerText="Name" title="Name of user">
              <h:outputText value="#{member.name}" />
            </p:column>
            <p:column headerText="Days" title="Days the user is working">
              <p:cellEditor>
                <f:facet name="output">
                  <h:outputText value="#{member.workingDays}" />
                </f:facet>
                <f:facet name="input">
                  <p:inputNumber
                    value="#{member.workingDays}"
                    minValue="0"
                    maxValue="#{data.sprint.maxWorkingDays}"
                    decimalPlaces="1"
                  />
                </f:facet>
              </p:cellEditor>
            </p:column>
            <p:column
              headerText="Capacity"
              title="Percentage user is working on sprint"
            >
              <p:cellEditor>
                <f:facet name="output">
                  <h:outputText value="#{member.capacity}%" />
                </f:facet>
                <f:facet name="input">
                  <p:inputNumber
                    value="#{member.capacity}"
                    minValue="0"
                    maxValue="100"
                    decimalPlacesRawValue="0"
                    validatorMessage="0-100"
                  />
                </f:facet>
              </p:cellEditor>
            </p:column>

            <p:column headerText="Points" title="story points">
              <h:outputText value="#{member.workingDays.doubleValue() * 0.4}">
                <f:convertNumber pattern="#0.0" />
              </h:outputText>
            </p:column>
            <p:column style="width: 6rem">
              <p:rowEditor />
            </p:column>

            <p:columnGroup type="footer">
              <p:row>
                <p:column colspan="3" />
                <p:column>
                  <f:facet name="footer">
                    <h:outputText
                      id="totalPoints"
                      value="#{logic.calculateTotalPoints()}"
                    >
                      <f:convertNumber pattern="#0.0" />
                    </h:outputText>
                  </f:facet>
                </p:column>
                <p:column />
              </p:row>
            </p:columnGroup>
          </p:dataTable>
          <p:remoteCommand
            name="refreshSprintTable"
            process="@this"
            update="sprint-datatable"
          />
        </h:form>

        <br />
        <div
          class="command-btns"
          style="position: fixed; bottom: 20px; right: 20px"
        >
          <p:commandButton
            id="proceed"
            actionListener="#{logic.close}"
            value="Close"
            update="form"
          />
        </div>
      </ui:define>
    </ui:composition>
  </h:body>
</html>

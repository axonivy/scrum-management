<html
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:f="jakarta.faces.core"
  xmlns:h="jakarta.faces.html"
  xmlns:ui="jakarta.faces.facelets"
  xmlns:ic="http://ivyteam.ch/jsf/component"
  xmlns:p="primefaces"
  xmlns:pe="primefaces.extensions"
>
  <h:body>
    <ui:composition template="/layouts/frame-10.xhtml">
      <ui:define name="title">TestDialog</ui:define>
      <ui:define name="content">
        <h1>#{data.sprint.versionCode}</h1>
        <h:form id="form">
          <p:dataTable
            value="#{data.sprint.members}"
            var="member"
            rowIndexVar="index"
            stickyHeader="true"
            editable="true"
            rowKey="#{index}"
            id="Sprint-datatabel"
          >
            <p:ajax event="rowEdit" update="Sprint-datatabel" />
            <p:ajax event="rowEditCancel" update="Sprint-datatabel" />

            <p:column headerText="Name">
              <p:cellEditor>
                <f:facet name="output">
                  <h:outputText value="#{member.name}" />
                </f:facet>

                <f:facet name="input">
                  <p:inputText value="#{member.name}" />
                </f:facet>
              </p:cellEditor>
            </p:column>
            <p:column headerText="Work days">
              <p:cellEditor>
                <f:facet name="output">
                  <h:outputText value="#{member.workingDays}" />
                </f:facet>
                <f:facet name="input">
                  <p:inputText value="#{member.workingDays}" />
                </f:facet>
              </p:cellEditor>
            </p:column>
            <p:column headerText="Work">
              <p:cellEditor>
                <f:facet name="output">
                  <h:outputText value="#{member.capacity}" />
                </f:facet>
                <f:facet name="input">
                  <p:inputText value="#{member.capacity}" />
                </f:facet>
              </p:cellEditor>
            </p:column>

            <p:column headerText="Points">
              <h:outputText value="#{member.workingDays.doubleValue() * 0.4}">
                <f:convertNumber pattern="#0.0" />
              </h:outputText>
            </p:column>
            <p:column style="width: 6rem">
              <p:rowEditor />
            </p:column>
          </p:dataTable>
        </h:form>

        <br />
        <div class="command-btns">
          <p:commandLink
            id="cancel"
            actionListener="#{ivyWorkflowView.cancel()}"
            process="@this"
            value="Cancel"
          />
          <p:commandButton
            id="proceed"
            actionListener="#{logic.close}"
            value="Proceed"
            update="form"
            icon="pi pi-check"
          />
        </div>

        <style type="text/css"></style>
      </ui:define>
    </ui:composition>
  </h:body>
</html>

<html
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:f="jakarta.faces.core"
  xmlns:h="jakarta.faces.html"
  xmlns:ui="jakarta.faces.facelets"
  xmlns:ic="http://ivyteam.ch/jsf/component"
  xmlns:p="primefaces"
  xmlns:pe="primefaces.extensions"
>
  <h:body>
    <ui:composition template="/layouts/frame-10.xhtml">
      <ui:define name="title">Sprint Overview</ui:define>
      <ui:define name="content">
        <style type="text/css">
          .days-missing > td {
            background-color: rgba(255, 0, 0, 0.5);
          }

          .rounded-table .ui-datatable-data > tr > td:first-child {
            border-radius: 8px 0 0 8px;
          }

          .rounded-table .ui-datatable-data > tr > td:last-child {
            border-radius: 0 8px 8px 0;
          }
        </style>
        <h:form id="form">
          <p:panel
            header="#{data.sprint.versionCode}"
            style="text-align: center; font-size: 30px"
          >
            <h:outputText
              value="#{data.sprint.startDate}"
              style="font-size: 50%"
            >
              <f:convertDateTime pattern="dd/MM/yyyy" />
            </h:outputText>

            <h:outputText value=" - " style="font-size: 50%" />

            <h:outputText value="#{data.sprint.endDate}" style="font-size: 50%">
              <f:convertDateTime pattern="dd/MM/yyyy" />
            </h:outputText>
            <h:outputText
              value=" / Sprint Number: #{data.sprint.sprintNumber}"
              style="font-size: 50%"
            />
          </p:panel>

          <br />

          <p:dataTable
            value="#{data.sprint.members}"
            var="member"
            rowIndexVar="index"
            stickyHeader="false"
            editable="true"
            rowEditMode="lazy"
            rowKey="#{index}"
            id="sprint-datatable"
            scrollable="true"
            allowUnsorting="true"
            liveResize="true"
            resizableColumns="true"
            cellNavigation="true"
            rowHover="true"
            styleClass="rounded-table"
            rowStyleClass="#{member.workingDays.intValue() lt 0 ? 'days-missing' : ''}"
          >
            <p:ajax event="rowEdit" oncomplete="refreshSprintTable()" />

            <p:column headerText="Name" title="Name of user">
              <div
                style="
                  display: flex;
                  flex-direction: row;
                  align-items: center;
                  gap: 8px;
                "
              >
                <p:avatar
                  icon="pi pi-user"
                  shape="circle"
                  style="
                    width: 24px;
                    height: 24px;
                    font-size: 11px;
                    flex-shrink: 0;
                  "
                />
                <h:outputText value="#{member.name}" />
              </div>
            </p:column>
            <p:column
              headerText="Days"
              title="Days the user is working"
              sortBy="#{member.workingDays.doubleValue()}"
            >
              <p:cellEditor>
                <f:facet name="output">
                  <h:outputText
                    value="#{member.workingDays}"
                    rendered="#{member.workingDays.intValue() ge 0}"
                  />
                </f:facet>
                <f:facet name="input">
                  <p:inputNumber
                    value="#{member.workingDays}"
                    minValue="0"
                    maxValue="#{data.sprint.maxWorkingDays}"
                    decimalPlaces="1"
                    emptyValue="empty"
                  />
                </f:facet>
              </p:cellEditor>
            </p:column>
            <p:column
              headerText="Capacity"
              title="Percentage user is working on sprint"
              sortBy="#{member.capacity.doubleValue()}"
            >
              <p:cellEditor>
                <f:facet name="output">
                  <h:outputText value="#{member.capacity}%" />
                </f:facet>
                <f:facet name="input">
                  <p:inputNumber
                    value="#{member.capacity}"
                    minValue="0"
                    maxValue="100"
                    decimalPlacesRawValue="0"
                    validatorMessage="0-100"
                  />
                </f:facet>
              </p:cellEditor>
            </p:column>

            <p:column
              headerText="Points (#{data.sprint.sprintPointsPerDay})"
              title="Points/Day#{data.sprint.sprintPointsPerDay}"
              sortBy="#{member.workingDays.intValue() lt 0 ? 0.0 : member.capacity.doubleValue() / 100 * member.workingDays.doubleValue() * data.sprint.sprintPointsPerDay.doubleValue()}"
            >
              <h:outputText
                value="#{member.workingDays.intValue() lt 0 ? 0.0 : member.capacity.doubleValue() / 100 * member.workingDays.doubleValue() * data.sprint.sprintPointsPerDay.doubleValue()}"
              >
                <f:convertNumber pattern="#0.0" />
              </h:outputText>
            </p:column>
            <p:column style="width: 6rem" headerText="Edit">
              <p:rowEditor />
            </p:column>
          </p:dataTable>
          <p:remoteCommand
            name="refreshSprintTable"
            process="@this"
            update="sprint-datatable totalpoints"
          />

          <br />
          <div
            style="
              display: flex;
              justify-content: space-between;
              align-items: center;

              background: var(--surface-a);
              border-top: 1px solid var(--surface-border);

              padding: 12px 20px;
              margin-top: 12px;

              position: sticky;
              bottom: 0;
              z-index: 10;
            "
          >
            <div
              class="command-btns"
              style="display: flex; align-items: center; gap: 8px"
            >
              <p:link
                id="editopensprint"
                value="Edit"
                href="#{ivy.html.startref('1A01A21D2B2203C2/start2.ivp')}?sprintId=#{ivy.repo.getId(data.sprint)}"
                styleClass="ui-button-raised ui-button-secondary"
              />

              <p:commandButton
                id="proceed"
                actionListener="#{logic.close}"
                value="Close"
                update="form"
                style="width: 100%"
                styleClass="ui-button-raised ui-button-secondary"
              />
            </div>
            <div>
              <h:outputText
                value="Total Points "
                style="font-size: 100%; font-weight: 600"
              >
              </h:outputText>
              <h:outputText
                id="totalpoints"
                value="#{logic.calculateTotalPoints()}"
                style="font-size: 100%; font-weight: 600"
              >
                <f:convertNumber pattern="#0.0" />
              </h:outputText>
            </div>
            <div
              class="command-btns"
              style="display: flex; align-items: center; gap: 8px"
            >
              <p:commandButton
                styleClass="rounded-button ui-button-primary"
                id="back"
                icon="fa-solid fa-angle-left"
                iconPos="middle"
                actionListener="#{logic.sprintlast}"
                update="@form"
              />
              <p:commandButton
                iconPos="middle"
                styleClass="rounded-button ui-button-primary"
                id="forward"
                icon="fa-solid fa-angle-right"
                actionListener="#{logic.sprintnext}"
                update="@form"
              />
            </div>
          </div>
        </h:form>
      </ui:define>
    </ui:composition>
  </h:body>
</html>

<html
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:f="jakarta.faces.core"
  xmlns:h="jakarta.faces.html"
  xmlns:ui="jakarta.faces.facelets"
  xmlns:ic="http://ivyteam.ch/jsf/component"
  xmlns:p="primefaces"
  xmlns:pe="primefaces.extensions"
>
  <h:body>
    <ui:composition template="/layouts/frame-10.xhtml">
      <ui:define name="title">Sprint Overview</ui:define>
      <ui:define name="content">
        <p:card title="Create sprint">
          <div class="grid">
            <div class="field col-12">
              <p:card style="width: 100%">
                <p:inputText
                  style="
                    width: 100%;
                    height: 50px;
                    font-size: 30px;
                    text-align: center;
                  "
                  value="Diavolezza"
                ></p:inputText>
              </p:card>
            </div>
            <div class="field col-12 sm:col-6">
              <p:card title="Start Date" style="text-align: center">
                <p:datePicker
                  id="startdate"
                  value="#{data.sprint.startDate}"
                  showIcon="true"
                  showOnFocus="false"
                />
              </p:card>
            </div>
            <div class="field col-12 sm:col-6">
              <p:card title="End Date" style="text-align: center">
                <p:datePicker
                  id="enddate"
                  value="#{data.sprint.endDate}"
                  showIcon="true"
                  showOnFocus="false"
                />
              </p:card>
            </div>
            <div class="field col-12 sm:col-6">
              <p:card title="Max Working days" style="text-align: center">
                <p:inputText></p:inputText>
              </p:card>
            </div>

            <div class="field col-12 sm:col-6">
              <p:card title="Story Points/Day" style="text-align: center">
                <p:inputText></p:inputText>
              </p:card>
            </div>

            <div class="field col-12 sm:col-6">
              <p:card title="Version" style="text-align: center">
                <p:inputNumber></p:inputNumber>
              </p:card>
            </div>

            <div class="field col-12 sm:col-6">
              <p:card
                style="text-align: center; height: 100%; text-align: center"
              >
                <p:button
                  value="Save"
                  style="font-size: 18px; padding: 8px 16px; margin-right: 5px"
                ></p:button>
                <p:button
                  value="Presets"
                  style="font-size: 18px; padding: 8px 16px; margin-left: 5px"
                ></p:button>
              </p:card>
            </div>
          </div>
        </p:card>
      </ui:define>
    </ui:composition>
  </h:body>
</html>

<html
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:f="jakarta.faces.core"
  xmlns:h="jakarta.faces.html"
  xmlns:ui="jakarta.faces.facelets"
  xmlns:ic="http://ivyteam.ch/jsf/component"
  xmlns:p="primefaces"
  xmlns:pe="primefaces.extensions"
>
  <h:body>
    <ui:composition template="/layouts/frame-10.xhtml">
      <ui:define name="title">Sprint Overview</ui:define>
      <ui:define name="content">
        <p:card title="Create sprint">
          <div style="display: flex">
            <div style="flex: 1">
              <div class="field col-12 md:col-4">
                <p:card style="height: 100%">
                  <p:outputLabel for="button" value="From:" />
                  <p:datePicker
                    id="button"
                    value="#{data.sprint.startDate}"
                    showIcon="true"
                    showOnFocus="false"
                    style="
                      display: flex;
                      justify-content: center;
                      align-items: center;
                    "
                  />
                </p:card>
              </div>
              <p:card>
                <p:outputPanel
                  style="
                    display: flex;
                    justify-content: center;
                    align-items: center;
                  " 
                  >Sprint name</p:outputPanel
                >
              </p:card>
            </div>
            <div style="flex: 1">
              <div class="field col-12 md:col-4">
                <p:card style="height: 100%">
                  <p:outputLabel for="button" value="To:" />
                  <p:datePicker
                    id="buttons"
                    value="#{data.sprint.endDate}"
                    showIcon="true"
                    showOnFocus="false"
                    style="
                      display: flex;
                      justify-content: center;
                      align-items: center;
                    "
                  />
                </p:card >
              </div>
              <p:card >
                <p:inputText
                  style="
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    width: 100%;
                    margin-bottom: 20px;
                  "
                ></p:inputText>
              </p:card>
            </div>
          </div>

          <p:card subtitle="" style="gap: 20px">
            <p:button value="Take presets"></p:button>
            <p:button value="Save"></p:button>
          </p:card>
        </p:card>
      </ui:define>
    </ui:composition>
  </h:body>
</html>

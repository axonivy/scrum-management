<html
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:f="jakarta.faces.core"
  xmlns:h="jakarta.faces.html"
  xmlns:ui="jakarta.faces.facelets"
  xmlns:ic="http://ivyteam.ch/jsf/component"
  xmlns:p="primefaces"
  xmlns:pe="primefaces.extensions"
>
  <h:body>
    <ui:composition template="/layouts/frame-10.xhtml">
      <ui:define name="title">New Sprint</ui:define>
      <ui:define name="content">
        <h:form id="CreateSprintForm">
          <p:messages id="messages" showDetail="true" />
          <p:card title="Create sprint">
            <div class="grid">
              <div class="field col-12">
                <p:card style="width: 100%">
                  <div
                    style="
                      display: flex;
                      align-items: center;
                      justify-content: center;
                      gap: 6px;
                      margin-bottom: 16px;
                    "
                  >
                    <i class="fa fa-person-skiing"></i>
                    <span style="font-size: 18px"> Sprint Name</span>
                  </div>
                  <p:inputText
                    style="
                      width: 100%;
                      height: 50px;
                      font-size: 30px;
                      text-align: center;
                    "
                    value="#{data.sprint.versionCode}"
                  ></p:inputText>
                </p:card>
              </div>
              <div class="field col-12 sm:col-6">
                <p:card style="text-align: center">
                  <div
                    style="
                      display: flex;
                      align-items: center;
                      justify-content: center;
                      gap: 6px;
                      margin-bottom: 16px;
                    "
                  >
                    <i class="pi pi-calendar-plus"></i>
                    <span style="font-size: 18px"> Start Date</span>
                  </div>
                  <p:datePicker
                    id="startdate"
                    value="#{data.sprint.startDate}"
                    pattern="dd/MM/yyyy"
                    showIcon="true"
                    showOnFocus="false"
                    ><f:convertDateTime pattern="dd/MM/yyyy" />
                    <p:ajax
                      event="dateSelect"
                      listener="#{logic.calculateMaxWorkingDays()}"
                      process="@this"
                      update="maxWorkingDays"
                    />
                  </p:datePicker>
                </p:card>
              </div>
              <div class="field col-12 sm:col-6">
                <p:card style="text-align: center">
                  <div
                    style="
                      display: flex;
                      align-items: center;
                      justify-content: center;
                      gap: 6px;
                      margin-bottom: 16px;
                    "
                  >
                    <i class="pi pi-calendar-minus"></i>
                    <span style="font-size: 18px"> End Date</span>
                  </div>
                  <p:datePicker
                    id="enddate"
                    value="#{data.sprint.endDate}"
                    pattern="dd/MM/yyyy"
                    showIcon="true"
                    showOnFocus="false"
                    ><f:convertDateTime pattern="dd/MM/yyyy" />
                    <p:ajax
                      event="dateSelect"
                      listener="#{logic.calculateMaxWorkingDays()}"
                      process="@this"
                      update="maxWorkingDays"
                    />
                  </p:datePicker>
                </p:card>
              </div>
              <div class="field col-12 sm:col-6">
                <p:card style="text-align: center">
                  <div
                    style="
                      display: flex;
                      align-items: center;
                      justify-content: center;
                      gap: 6px;
                      margin-bottom: 16px;
                    "
                  >
                    <i class="pi pi-clock"></i>
                    <span style="font-size: 18px"> Max Working days</span>
                  </div>
                  <p:inputNumber
                    value="#{data.sprint.maxWorkingDays}"
                    minValue="0"
                    decimalPlaces="1"
                    id="maxWorkingDays"
                  />
                </p:card>
              </div>

              <div class="field col-12 sm:col-6">
                <p:card style="text-align: center">
                  <div
                    style="
                      display: flex;
                      align-items: center;
                      justify-content: center;
                      gap: 6px;
                      margin-bottom: 16px;
                    "
                  >
                    <i class="pi pi-chart-bar"></i>
                    <span style="font-size: 18px"> Story Points/Day</span>
                  </div>
                  <p:inputNumber
                    value="#{data.sprint.sprintPointsPerDay}"
                    minValue="0"
                    decimalPlaces="2"
                  />
                </p:card>
              </div>

              <div class="field col-12 sm:col-6">
                <p:card style="text-align: center">
                  <div
                    style="
                      display: flex;
                      align-items: center;
                      justify-content: center;
                      gap: 6px;
                      margin-bottom: 16px;
                    "
                  >
                    <i class="pi pi-hashtag"></i>
                    <span style="font-size: 18px"> Sprint Number</span>
                  </div>
                  <p:inputNumber value="#{data.sprint.sprintNumber}" />
                </p:card>
              </div>

              <div class="field col-12 sm:col-6">
                <p:card
                  style="text-align: center; height: 100%; text-align: center"
                >
                  <p:commandButton
                    value="Save"
                    style="font-size: 100%; padding: 8px 16px; margin-left: 5px"
                    styleClass="ui-button-raised ui-button-primary"
                    process="@form"
                    update="messages"
                    actionListener="#{logic.save}"
                    icon="pi pi-save"
                  />
                  <p:commandButton
                    value="Close"
                    style="font-size: 100%; padding: 8px 16px; margin-left: 5px"
                    styleClass="ui-button-raised ui-button-secondary"
                    process="@this"
                    actionListener="#{logic.close}"
                    icon="pi pi-times"
                  ></p:commandButton>
                </p:card>
              </div>
            </div>
          </p:card>
        </h:form>
      </ui:define>
    </ui:composition>
  </h:body>
</html>
